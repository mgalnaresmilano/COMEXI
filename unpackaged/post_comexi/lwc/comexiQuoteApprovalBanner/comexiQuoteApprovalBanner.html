<template>
    <div class="comexi-wrapper">
        <template if:true={loadError}>
            <div class="slds-notify slds-notify_alert slds-theme_error comexi-banner" role="alert">
                <lightning-icon icon-name="utility:error" variant="inverse" size="small"></lightning-icon>
                <span class="slds-m-left_small">{loadError}</span>
            </div>
        </template>

        <template if:true={ready}>
            <div class={themeClass} role="alert">
                <div class="comexi-banner__main">
                    <lightning-icon icon-name={iconName} variant="inverse" size="small"></lightning-icon>
                    <div class="slds-m-left_small comexi-banner__text">
                        <p class="comexi-banner__headline">{headline}</p>
                        <p class="comexi-banner__detail">{detail}</p>
                    </div>
                </div>

                <div class="comexi-banner__metrics">
                    <div class="comexi-metric">
                        <span class="comexi-metric__label">Descuento</span>
                        <span class="comexi-metric__value">{discountLabel}</span>
                    </div>
                    <div class="comexi-metric">
                        <span class="comexi-metric__label">Máx. línea</span>
                        <span class="comexi-metric__value">{maxLineDiscountLabel}</span>
                    </div>
                    <div class="comexi-metric">
                        <span class="comexi-metric__label">Margen</span>
                        <span class="comexi-metric__value">{marginLabel}</span>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        variant="bare-inverse"
                        alternative-text="Recalcular"
                        title="Volver a leer el descuento y el estado de aprobación"
                        onclick={handleRefresh}
                        disabled={working}
                    ></lightning-button-icon>
                </div>
            </div>

            <template if:true={levels.length}>
                <ul class="comexi-levels">
                    <template for:each={levels} for:item="level">
                        <li key={level.key} class={level.cssClass}>
                            <lightning-icon icon-name={level.icon} size="xx-small"></lightning-icon>
                            <span class="slds-m-left_x-small">{level.label}</span>
                        </li>
                    </template>
                </ul>
            </template>

            <template if:true={showSubmit}>
                <div class="comexi-actions">
                    <lightning-button
                        variant="brand"
                        label={submitLabel}
                        onclick={handleSubmit}
                        disabled={working}
                    ></lightning-button>
                </div>
            </template>

            <template if:true={showApprovalsHint}>
                <p class="comexi-hint">
                    <lightning-icon icon-name="utility:approval" size="xx-small"></lightning-icon>
                    <span class="slds-m-left_x-small">
                        Firma o rechaza en la pestaña <strong>Approvals</strong> de la oferta: ahí queda la
                        traza con fecha, persona y motivo.
                    </span>
                </p>
            </template>

            <template if:true={working}>
                <lightning-spinner alternative-text="Procesando" size="small"></lightning-spinner>
            </template>
        </template>
    </div>
</template>
